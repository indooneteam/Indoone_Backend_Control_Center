name: Web Admin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Source checks, typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Source smoke checks
        run: npm run test:smoke
      - name: API URL unit tests
        run: npm test
      - name: TypeScript validation
        run: npm run typecheck
      - name: Production build
        run: npm run build
