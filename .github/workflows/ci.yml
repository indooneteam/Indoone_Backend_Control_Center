name: Web Admin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bootstrap-check:
    name: Bootstrap repository check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify CI workflow exists
        run: test -f .github/workflows/ci.yml
