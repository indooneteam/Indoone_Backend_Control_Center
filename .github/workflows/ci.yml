name: Web Admin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Source checks, typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Dependency security audit
        run: npm audit --audit-level=moderate
      - name: Source smoke checks
        run: npm run test:smoke
      - name: API URL unit tests
        run: npm test
      - name: TypeScript validation
        run: npm run typecheck
      - name: Production build
        run: npm run build

  gateway-test:
    name: Gateway API tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gateway/requirements*.txt
      - name: Install gateway test dependencies
        run: python -m pip install -r gateway/requirements-dev.txt
      - name: Compile gateway
        run: python -m compileall -q gateway
      - name: Run gateway tests
        run: python -m pytest -q gateway/tests
